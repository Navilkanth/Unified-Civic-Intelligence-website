{% extends "base.html" %}
{% block title %}Post news{% endblock %}
{% block content %}
<div class="max-w-xl mx-auto rounded-2xl border border-slate-200 bg-white p-8 shadow-sm">
  <h1 class="font-display text-2xl text-civic-navy mb-6">Leadership announcement</h1>
  <form method="post" class="space-y-4 text-sm">
    <input name="title" required placeholder="Title" class="w-full rounded-lg border border-slate-300 px-3 py-2">
    <input name="district" placeholder="District filter (optional)" class="w-full rounded-lg border border-slate-300 px-3 py-2">
    <textarea name="body" rows="6" placeholder="Body" class="w-full rounded-lg border border-slate-300 px-3 py-2"></textarea>
    <button type="submit" class="w-full py-2.5 rounded-lg bg-civic-navy text-white font-semibold">Publish & push realtime</button>
  </form>
</div>
{% endblock %}
