{% extends "base.html" %}
{% block title %}Party complaint{% endblock %}
{% block content %}
<div class="max-w-xl mx-auto rounded-2xl border border-slate-200 bg-white p-8 shadow-sm">
  <h1 class="font-display text-2xl text-civic-navy mb-2">Complaint against party member</h1>
  <p class="text-xs text-slate-500 mb-6">Workflow: Member → District review → Leadership → Action.</p>
  <form method="post" class="space-y-4 text-sm">
    <input name="title" required class="w-full rounded-lg border border-slate-300 px-3 py-2" placeholder="Title">
    <textarea name="body" rows="6" required class="w-full rounded-lg border border-slate-300 px-3 py-2" placeholder="Detailed narrative"></textarea>
    <button type="submit" class="w-full py-2.5 rounded-lg bg-civic-navy text-white font-semibold">Submit to district desk</button>
  </form>
</div>
{% endblock %}
