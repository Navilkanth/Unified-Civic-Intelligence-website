{% extends "base.html" %}

{% block title %}Welfare Request System{% endblock %}
{% block content %}
<div class="max-w-3xl mx-auto py-8">
    <h1 class="text-3xl font-bold mb-6 text-indigo-700">Welfare Request System</h1>
    <p class="text-gray-600 mb-8">Submit your request for medical help, scholarship support, food assistance, or disaster relief. Our AI engine will also recommend suitable schemes.</p>
    
    <div class="bg-white p-6 rounded-lg shadow-md">
        <form method="POST" enctype="multipart/form-data" action="{{ url_for('charity.welfare_new') }}">
            <div class="mb-4">
                <label for="request_type" class="block text-sm font-medium text-gray-700">Request Type</label>
                <select name="request_type" id="request_type" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm p-2 border" required>
                    <option value="medical">Medical Help</option>
                    <option value="scholarship">Scholarship Support</option>
                    <option value="food">Food Assistance</option>
                    <option value="disaster">Disaster Relief</option>
                </select>
            </div>
            
            <div class="mb-4">
                <label for="narrative" class="block text-sm font-medium text-gray-700">Detailed Narrative / Description</label>
                <textarea name="narrative" id="narrative" rows="4" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm p-2 border" required placeholder="Please describe your situation and the support you need..."></textarea>
            </div>
            
            <div class="mb-6">
                <label for="documents" class="block text-sm font-medium text-gray-700">Upload Proof (Documents, Medical Proof, Income Certificates)</label>
                <input type="file" name="documents" id="documents" multiple class="mt-1 block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 p-2 border rounded-md">
            </div>
            
            <button type="submit" class="w-full bg-indigo-600 text-white font-semibold py-2 px-4 rounded-md shadow hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2">Submit Request</button>
        </form>
    </div>
</div>
{% endblock %}
