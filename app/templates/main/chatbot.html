{% extends "base.html" %}
{% block title %}AI Assistant{% endblock %}
{% block content %}
<div class="max-w-3xl mx-auto">
  <h1 class="font-display text-3xl text-civic-navy mb-2">Civic AI Assistant</h1>
  <p class="text-slate-600 mb-6">Demo responses — wire to your LLM / RAG service for production.</p>
  <div id="chat" class="rounded-2xl border border-slate-200 bg-white p-4 h-80 overflow-y-auto text-sm space-y-3 mb-4"></div>
  <form id="chat-form" class="flex gap-2">
    <input name="q" class="flex-1 rounded-lg border border-slate-300 px-3 py-2 text-sm" placeholder="Ask about complaints, welfare, or projects…" autocomplete="off">
    <button type="submit" class="px-4 py-2 rounded-lg bg-civic-teal text-white text-sm font-semibold">Send</button>
  </form>
</div>
{% endblock %}
{% block scripts %}
<script>
(function(){
  var chat = document.getElementById('chat');
  function add(role, text) {
    var d = document.createElement('div');
    d.className = role === 'user' ? 'text-right text-civic-navy font-medium' : 'text-slate-700';
    d.textContent = (role === 'user' ? 'You: ' : 'Assistant: ') + text;
    chat.appendChild(d);
    chat.scrollTop = chat.scrollHeight;
  }
  add('bot', 'Vanakkam / Welcome. Ask about complaint status, welfare schemes, or ward projects.');
  document.getElementById('chat-form').addEventListener('submit', function(e){
    e.preventDefault();
    var q = (this.q.value || '').trim();
    if (!q) return;
    add('user', q);
    this.q.value = '';
    var low = q.toLowerCase();
    var ans = 'I can escalate this to a human agent. For demo purposes: explore Governance → Funds for budget transparency, Charity → Transparency for donations, or TVK hub for volunteer news.';
    if (/complaint|issue|delay/.test(low)) ans = 'Complaints are tracked with sentiment + AI category tagging. Signed-in citizens can file under Governance → New complaint.';
    if (/welfare|medical|scholar|food/.test(low)) ans = 'Welfare: submit a request under Charity → Welfare. AI suggests scheme alignment from your narrative keywords.';
    if (/fund|budget|road|project/.test(low)) ans = 'Open Governance → Government funds to see sanctioned vs spent, contractors, and completion %.';
    if (/volunteer|tvk|rally|event/.test(low)) ans = 'TVK Singapadai hub lists cadre news, rallies, and membership QR cards after you register your volunteer profile.';
    setTimeout(function(){ add('bot', ans); }, 400);
  });
})();
</script>
{% endblock %}
