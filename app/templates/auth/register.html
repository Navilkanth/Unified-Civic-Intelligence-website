{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="max-w-md mx-auto rounded-2xl border border-slate-200 bg-white p-8 shadow-sm">
  <h1 class="font-display text-2xl text-civic-navy mb-6">Create access</h1>
  {% if error %}<p class="text-red-600 text-sm mb-4">{{ error }}</p>{% endif %}
  <form method="post" class="space-y-4">
    <div>
      <label class="block text-xs font-semibold text-slate-500 uppercase">Full name</label>
      <input name="full_name" required class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm">
    </div>
    <div>
      <label class="block text-xs font-semibold text-slate-500 uppercase">Email</label>
      <input type="email" name="email" required class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm">
    </div>
    <div>
      <label class="block text-xs font-semibold text-slate-500 uppercase">Password</label>
      <input type="password" name="password" required minlength="8" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm">
    </div>
    <div>
      <label class="block text-xs font-semibold text-slate-500 uppercase">Role</label>
      <select name="role" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm">
        <option value="citizen">Citizen</option>
        <option value="councillor">Councillor</option>
        <option value="volunteer">TVK Volunteer</option>
        <option value="donor">Donor / Sponsor</option>
      </select>
    </div>
    <button type="submit" class="w-full py-2.5 rounded-lg bg-civic-teal text-white font-semibold text-sm">Register</button>
  </form>
</div>
{% endblock %}
