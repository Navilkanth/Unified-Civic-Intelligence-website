{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="max-w-md mx-auto rounded-2xl border border-slate-200 bg-white p-8 shadow-sm">
  <h1 class="font-display text-2xl text-civic-navy mb-6">Secure sign in</h1>
  {% if error %}<p class="text-red-600 text-sm mb-4">{{ error }}</p>{% endif %}
  <form method="post" class="space-y-4">
    <div>
      <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wide">Email</label>
      <input type="email" name="email" required class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm">
    </div>
    <div>
      <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wide">Password</label>
      <input type="password" name="password" required class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm">
    </div>
    <button type="submit" class="w-full py-2.5 rounded-lg bg-civic-navy text-white font-semibold text-sm hover:bg-slate-900">Continue</button>
  </form>
  <p class="text-sm text-slate-600 mt-4">New citizen? <a href="{{ url_for('auth.register') }}" class="text-civic-teal font-semibold">Create account</a></p>
</div>
{% endblock %}
