{% extends "base.html" %}
{% block title %}New complaint{% endblock %}
{% block content %}
<div class="max-w-xl mx-auto rounded-2xl border border-slate-200 bg-white p-8 shadow-sm">
  <h1 class="font-display text-2xl text-civic-navy mb-6">Public complaint</h1>
  <form method="post" class="space-y-4 text-sm">
    <div>
      <label class="font-semibold text-slate-700">Ward</label>
      <select name="ward_id" required class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2">
        {% for w in wards %}<option value="{{ w.id }}">{{ w.code }} — {{ w.name_en }}</option>{% endfor %}
      </select>
    </div>
    <div>
      <label class="font-semibold text-slate-700">Title</label>
      <input name="title" required class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2">
    </div>
    <div>
      <label class="font-semibold text-slate-700">Description</label>
      <textarea name="body" rows="5" required class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2"></textarea>
    </div>
    <label class="flex items-center gap-2 text-slate-600">
      <input type="checkbox" name="anonymous"> Submit anonymously (identity hidden from councillor view)
    </label>
    <button type="submit" class="w-full py-2.5 rounded-lg bg-civic-navy text-white font-semibold">Submit with AI triage</button>
  </form>
</div>
{% endblock %}
