{% extends "base.html" %}
{% block title %}Land report{% endblock %}
{% block content %}
<div class="max-w-xl mx-auto rounded-2xl border border-slate-200 bg-white p-8 shadow-sm">
  <h1 class="font-display text-2xl text-civic-navy mb-2">Land & patta protection</h1>
  <p class="text-sm text-slate-600 mb-6">Report encroachment, temple land issues, or misuse with survey numbers and geo-tags (maps on roadmap).</p>
  <form method="post" class="space-y-4 text-sm">
    <div>
      <label class="font-semibold">Survey number</label>
      <input name="survey_number" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2">
    </div>
    <div>
      <label class="font-semibold">Type</label>
      <select name="report_type" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2">
        <option>Illegal occupation</option>
        <option>Temple land encroachment</option>
        <option>Government land misuse</option>
        <option>Public land occupation</option>
      </select>
    </div>
    <div>
      <label class="font-semibold">Narrative</label>
      <textarea name="description" rows="5" required class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2"></textarea>
    </div>
    <button type="submit" class="w-full py-2.5 rounded-lg bg-civic-navy text-white font-semibold">Submit securely</button>
  </form>
</div>
{% endblock %}
