{% extends "base.html" %}

{% block content %}
<h1>New Development Plan</h1>
<form method="POST" action="">
    <div class="mb-4">
        <label for="name" class="block text-gray-700">Plan Name</label>
        <input type="text" id="name" name="name" class="w-full border border-gray-300 px-4 py-2">
    </div>
    <div class="mb-4">
        <label for="description" class="block text-gray-700">Description</label>
        <textarea id="description" name="description" class="w-full border border-gray-300 px-4 py-2"></textarea>
    </div>
    <div class="mb-4">
        <label for="affected_areas" class="block text-gray-700">Affected Areas</label>
        <input type="text" id="affected_areas" name="affected_areas" class="w-full border border-gray-300 px-4 py-2">
    </div>
    <div class="mb-4">
        <label for="timeline" class="block text-gray-700">Timeline</label>
        <input type="text" id="timeline" name="timeline" class="w-full border border-gray-300 px-4 py-2">
    </div>
    <div class="mb-4">
        <label for="purpose" class="block text-gray-700">Purpose</label>
        <textarea id="purpose" name="purpose" class="w-full border border-gray-300 px-4 py-2"></textarea>
    </div>
    <button type="submit" class="bg-blue-500 text-white px-4 py-2">Submit</button>
</form>
{% endblock %}
